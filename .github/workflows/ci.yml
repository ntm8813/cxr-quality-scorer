name: CI Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Uses micromamba to read and spin up your environment.yml file directly
    - name: Setup Micromamba
      uses: mamba-org/setup-micromamba@v2
      with:
        environment-file: environment.yml
        init-shell: bash
        cache-environment: true

    # Runs your test suite completely inside the conda context
    - name: Run tests
      shell: bash -l {0}
      run: |
        pytest tests/ -v --tb=short