name: CI Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Micromamba
      uses: mamba-org/setup-micromamba@v2
      with:
        environment-file: environment.yml
        init-shell: bash
        cache-environment: true

    - name: Prepare test data directory
      run: |
        mkdir -p data/processed
        # Generate a dummy HDF5 file so the test doesn't crash
        python -c "import h5py; import numpy as np; f = h5py.File('data/processed/cxr_degraded.h5', 'w'); f.create_dataset('image', data=np.zeros((1, 1024, 1024))); f.close()"

    - name: Run tests
      run: |
        pytest tests/ -v --tb=short