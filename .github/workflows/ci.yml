name: CI Smoke Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: cxr
          activate-environment: cxr
          init-shell: bash
          cache-environment: true

      - name: Verify environment
        shell: bash -l {0}
        run: |
          which python
          python --version
          python -c "import h5py; print('h5py OK')"
          python -c "import numpy; print('numpy OK')"

      - name: Prepare test data directory
        shell: bash -l {0}
        run: |
          mkdir -p data/processed
          python - <<'PY'
          import h5py
          import numpy as np

          with h5py.File("data/processed/cxr_degraded.h5", "w") as f:
              f.create_dataset(
                  "image",
                  data=np.zeros((1, 1024, 1024), dtype=np.float32)
              )
          print("Dummy HDF5 created")
          PY

      - name: Run tests
        shell: bash -l {0}
        run: |
          pytest tests/ -v --tb=short